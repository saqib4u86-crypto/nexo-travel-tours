<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#DFC15D" />
      <stop offset="30%" stopColor="#C59B27" />
      <stop offset="60%" stopColor="#F3E5AB" />
      <stop offset="85%" stopColor="#B8860B" />
      <stop offset="100%" stopColor="#996515" />
    </linearGradient>
    <linearGradient id="goldLinearH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#B8860B" />
      <stop offset="50%" stopColor="#E6CA65" />
      <stop offset="100%" stopColor="#B8860B" />
    </linearGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#ECCB65" />
      <stop offset="25%" stopColor="#B38018" />
      <stop offset="50%" stopColor="#FBF0B9" />
      <stop offset="75%" stopColor="#C69214" />
      <stop offset="100%" stopColor="#8A5A00" />
    </linearGradient>
    <linearGradient id="navyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0B2240" />
      <stop offset="50%" stopColor="#07162C" />
      <stop offset="100%" stopColor="#030D1B" />
    </linearGradient>
    <linearGradient id="navyHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#123258" />
      <stop offset="100%" stopColor="#081A32" />
    </linearGradient>
    <linearGradient id="nexoTextGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#DFBF5B" />
      <stop offset="25%" stopColor="#C9981E" />
      <stop offset="48%" stopColor="#FFF2B8" />
      <stop offset="55%" stopColor="#E2BD4E" />
      <stop offset="85%" stopColor="#B38018" />
      <stop offset="100%" stopColor="#8A5A00" />
    </linearGradient>
    <linearGradient id="nexoTextStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#8F6209" />
      <stop offset="50%" stopColor="#E6CA65" />
      <stop offset="100%" stopColor="#754E00" />
    </linearGradient>
  </defs>

  <!-- 1. Base Circular Disc -->
  <circle cx="250" cy="250" r="238" fill="#FFFFFF" />

  <!-- 2. Double Gold Concentric Border Ring -->
  <circle cx="250" cy="250" r="234" stroke="url(#goldRim)" stroke-width="6.5" fill="none" />
  <circle cx="250" cy="250" r="225" stroke="url(#goldRim)" stroke-width="2" fill="none" />

  <!-- 3. Compass Star & Airplane -->
  <g>
    <!-- Letter N -->
    <text x="250" y="83" text-anchor="middle" fill="#0B2240" font-family="'Cinzel', 'Times New Roman', serif" font-size="23" font-weight="800" letter-spacing="0.05em">N</text>

    <!-- Compass Dial Ring -->
    <circle cx="250" cy="176" r="66" stroke="#0B2240" stroke-width="6" stroke-dasharray="22 13" fill="none" />
    <circle cx="250" cy="176" r="60" stroke="#0B2240" stroke-width="1.5" fill="none" />

    <!-- Dial Ticks -->
    <g stroke="#0B2240">
      <line x1="250" y1="108" x2="250" y2="114" stroke-width="3" />
      <line x1="250" y1="108" x2="250" y2="114" stroke-width="1.5" transform="rotate(30 250 176)" />
      <line x1="250" y1="108" x2="250" y2="114" stroke-width="1.5" transform="rotate(60 250 176)" />
      <line x1="250" y1="108" x2="250" y2="114" stroke-width="3" transform="rotate(90 250 176)" />
      <line x1="250" y1="108" x2="250" y2="114" stroke-width="1.5" transform="rotate(120 250 176)" />
      <line x1="250" y1="108" x2="250" y2="114" stroke-width="1.5" transform="rotate(150 250 176)" />
      <line x1="250" y1="108" x2="250" y2="114" stroke-width="3" transform="rotate(180 250 176)" />
      <line x1="250" y1="108" x2="250" y2="114" stroke-width="1.5" transform="rotate(210 250 176)" />
      <line x1="250" y1="108" x2="250" y2="114" stroke-width="1.5" transform="rotate(240 250 176)" />
      <line x1="250" y1="108" x2="250" y2="114" stroke-width="3" transform="rotate(270 250 176)" />
      <line x1="250" y1="108" x2="250" y2="114" stroke-width="1.5" transform="rotate(300 250 176)" />
      <line x1="250" y1="108" x2="250" y2="114" stroke-width="1.5" transform="rotate(330 250 176)" />
    </g>

    <!-- Diagonal Needles -->
    <polygon points="250,176 250,138 290,138" fill="url(#navyGradient)" transform="rotate(45 250 176)" />
    <polygon points="250,176 290,138 250,176" fill="#1B3A60" transform="rotate(45 250 176)" />
    <polygon points="250,176 250,138 290,138" fill="url(#navyGradient)" transform="rotate(135 250 176)" />
    <polygon points="250,176 290,138 250,176" fill="#1B3A60" transform="rotate(135 250 176)" />
    <polygon points="250,176 250,138 290,138" fill="url(#navyGradient)" transform="rotate(225 250 176)" />
    <polygon points="250,176 290,138 250,176" fill="#1B3A60" transform="rotate(225 250 176)" />
    <polygon points="250,176 250,138 290,138" fill="url(#navyGradient)" transform="rotate(315 250 176)" />
    <polygon points="250,176 290,138 250,176" fill="#1B3A60" transform="rotate(315 250 176)" />

    <!-- Cardinal Needles -->
    <polygon points="250,88 250,176 238,176" fill="url(#goldGradient)" />
    <polygon points="250,88 262,176 250,176" fill="url(#navyGradient)" />
    <polygon points="250,264 250,176 262,176" fill="url(#goldGradient)" />
    <polygon points="250,264 238,176 250,176" fill="url(#navyGradient)" />
    <polygon points="338,176 250,176 250,164" fill="url(#navyGradient)" />
    <polygon points="338,176 250,188 250,176" fill="url(#navyHighlight)" />
    <polygon points="162,176 250,176 250,188" fill="url(#navyGradient)" />
    <polygon points="162,176 250,164 250,176" fill="url(#navyHighlight)" />

    <!-- Center Hub -->
    <circle cx="250" cy="176" r="14" fill="#FFFFFF" stroke="url(#navyGradient)" stroke-width="3" />
    <circle cx="250" cy="176" r="7" fill="url(#goldGradient)" />

    <!-- Swoosh Ribbon -->
    <path d="M 140 240 C 160 210, 195 168, 250 162 C 285 158, 315 152, 342 135" stroke="url(#navyGradient)" stroke-width="7" stroke-linecap="round" fill="none" />
    <path d="M 141 240 C 162 208, 198 165, 252 159 C 288 155, 318 149, 345 132" stroke="url(#goldGradient)" stroke-width="4.5" stroke-linecap="round" fill="none" />

    <!-- Golden Airplane -->
    <g transform="translate(352, 130) rotate(38) scale(1.15)">
      <path d="M0,-16 C1.8,-12 2,-4 2,12 L-2,12 C-2,-4 -1.8,-12 0,-16 Z" fill="url(#goldGradient)" />
      <path d="M0,-2 L18,5 L18,8 L0,3 L-18,8 L-18,5 Z" fill="url(#goldGradient)" />
      <path d="M0,8 L7,12 L7,14 L0,11 L-7,14 L-7,12 Z" fill="url(#goldGradient)" />
    </g>
  </g>

  <!-- 4. Wordmark: NEXO (Gold) & TRAVEL & TOURS (Navy) -->
  <text x="250" y="336" text-anchor="middle" fill="url(#nexoTextGold)" stroke="url(#nexoTextStroke)" stroke-width="1.8" stroke-linejoin="round" font-family="'Cinzel', 'Playfair Display', 'Times New Roman', Georgia, serif" font-size="76" font-weight="800" letter-spacing="0.08em">NEXO</text>
  <text x="250" y="336" text-anchor="middle" fill="none" stroke="#FFF8D6" stroke-width="0.8" stroke-linejoin="round" font-family="'Cinzel', 'Playfair Display', 'Times New Roman', Georgia, serif" font-size="76" font-weight="800" letter-spacing="0.08em">NEXO</text>
  <text x="250" y="336" text-anchor="middle" fill="url(#nexoTextGold)" fill-opacity="0.96" font-family="'Cinzel', 'Playfair Display', 'Times New Roman', Georgia, serif" font-size="76" font-weight="800" letter-spacing="0.08em">NEXO</text>

  <line x1="98" y1="357" x2="135" y2="357" stroke="url(#goldLinearH)" stroke-width="2.4" stroke-linecap="round" />
  <text x="250" y="363" text-anchor="middle" fill="#0B2240" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="20.5" font-weight="700" letter-spacing="0.28em">TRAVEL &amp; TOURS</text>
  <line x1="365" y1="357" x2="402" y2="357" stroke="url(#goldLinearH)" stroke-width="2.4" stroke-linecap="round" />

  <!-- 5. Bottom Ornamental Flourish -->
  <g transform="translate(250, 414)">
    <line x1="-58" y1="0" x2="-14" y2="0" stroke="#0B2240" stroke-width="1.5" stroke-linecap="round" />
    <polygon points="-12,0 -9,-2.5 -6,0 -9,2.5" fill="url(#goldGradient)" />
    <circle cx="0" cy="0" r="4.2" fill="url(#goldGradient)" stroke="#FFFFFF" stroke-width="0.8" />
    <polygon points="6,0 9,-2.5 12,0 9,2.5" fill="url(#goldGradient)" />
    <line x1="14" y1="0" x2="58" y2="0" stroke="#0B2240" stroke-width="1.5" stroke-linecap="round" />
  </g>
</svg>
